name: Revisar

# Se ejecuta con cada propuesta de cambios (pull request) y con cada subida a main:
# comprueba el catálogo, los tipos y las pruebas, para que nada roto llegue a la app.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: revisar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Catálogo de juegos
        run: npm run validar
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas
        run: npm test
