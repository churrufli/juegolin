name: APK Android

# Compila el APK sin EAS. Se lanza a mano (Actions → APK Android → Run workflow,
# eligiendo la rama) o al subir cambios a la rama "apk".
on:
  workflow_dispatch:
  push:
    branches:
      - apk

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Caché del código C++ de React Native: lo que más tarda en compilar.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-arm64
          max-size: 2G

      - name: Ajustes de Gradle
        run: |
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          org.gradle.parallel=true
          org.gradle.caching=true
          PROPS

      - name: Número de versión
        run: |
          CODE=$((100 + GITHUB_RUN_NUMBER))
          echo "ANDROID_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          # la app lo lee para saber si hay una versión más nueva en Releases
          echo "{ \"build\": $CODE }" > src/data/build.json

      - name: Dependencias
        run: npm ci

      - name: Generar proyecto Android
        run: npx expo prebuild --platform android --no-install --clean

      - name: Clave de firma
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/juegolin.jks"
          echo "JUEGOLIN_KEYSTORE_PATH=$RUNNER_TEMP/juegolin.jks" >> "$GITHUB_ENV"

      - name: Aviso sin clave
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::Falta el secreto ANDROID_KEYSTORE_BASE64. El APK se firma con la clave de depuración y solo sirve de prueba."

      - name: Compilar APK
        working-directory: android
        env:
          JUEGOLIN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          JUEGOLIN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          JUEGOLIN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Nombrar APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          SUFFIX=$([ "$HAS_KEYSTORE" = true ] && echo "" || echo "-PRUEBA")
          NAME="juegolin-$VERSION-build$ANDROID_VERSION_CODE$SUFFIX.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          echo "APK_TAG=v$VERSION-build$ANDROID_VERSION_CODE" >> "$GITHUB_ENV"

      # Con clave propia: versión normal. Sin clave: prerelease de prueba (firmada con la clave de depuración).
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=$([ "$HAS_KEYSTORE" = true ] && echo "" || echo "--prerelease")
          gh release create "$APK_TAG" "$APK_NAME" $PRE \
            --target "$GITHUB_SHA" \
            --title "Juegolín $APK_TAG" \
            --notes "APK compilado desde la rama ${GITHUB_REF_NAME} (${GITHUB_SHA::7})."
